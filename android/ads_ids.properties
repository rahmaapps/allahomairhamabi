# Identifiants AdMob — SOURCE UNIQUE DE VÉRITÉ (LOT 5.F).
#
# Ce fichier est lu par Gradle (android/app/build.gradle.kts) pour injecter
# `com.google.android.gms.ads.APPLICATION_ID` dans AndroidManifest.xml via le
# placeholder ${admobAppId}. Les mêmes valeurs sont déclarées côté Dart dans
# lib/monetization/ads_config.dart, et un test
# (test/monetization/ads_config_test.dart) échoue si les deux divergent :
# il est donc IMPOSSIBLE de laisser le manifest et AdsConfig sur des
# environnements différents sans que la suite de tests le signale.
#
# Ce ne sont PAS des secrets : les identifiants AdMob sont publics (ils sont
# lisibles dans tout APK). Ce fichier est donc versionné, contrairement à
# android/key.properties.
#
# Environnement sélectionné par --dart-define=ADS_ENV=test|production
# (défaut : test). Voir docs/monetisation/ETAT_LOTS_5.md.

# --- TEST : identifiants de démonstration officiels Google ---
# https://developers.google.com/admob/android/test-ads
test.appId=ca-app-pub-3940256099942544~3347511713
test.bannerAdUnitId=ca-app-pub-3940256099942544/6300978111
test.interstitialAdUnitId=ca-app-pub-3940256099942544/1033173712

# --- PRODUCTION : à renseigner après création du compte et des unités AdMob ---
# Tant que ces valeurs commencent par PLACEHOLDER_PRODUCTION_, tout build
# lancé avec ADS_ENV=production échoue explicitement (fail-fast Gradle) au
# lieu de produire un APK inutilisable.
# Une seule unité Banner est prévue, partagée par HOME / Recherche / Favoris
# (décision produit LOT 5.F) : la distinction des surfaces reste assurée par
# `AdSurface`, jamais par des unités distinctes.
production.appId=PLACEHOLDER_PRODUCTION_APP_ID
production.bannerAdUnitId=PLACEHOLDER_PRODUCTION_BANNER_AD_UNIT_ID
production.interstitialAdUnitId=PLACEHOLDER_PRODUCTION_INTERSTITIAL_AD_UNIT_ID
