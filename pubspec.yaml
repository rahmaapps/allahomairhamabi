name: test_1
description: "Dua app for deceased loved ones"
publish_to: 'none'

version: 1.1.0+5

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  share_plus: ^7.2.1
  provider: ^6.0.5
  url_launcher: ^6.3.0
  google_mobile_ads: ^9.1.0
  in_app_review: ^2.0.11


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/duas.json
    - assets/premium/previews/dark_luxe_thumb.png
    - assets/premium/previews/emerald_thumb.png
    - assets/premium/previews/white_elegant_thumb.png
    - assets/premium/templates/dark_luxe.png
    - assets/premium/templates/emerald.png
    - assets/premium/templates/white_elegant.png


  fonts:
    - family: Lateef
      fonts:
        - asset: assets/fonts/Lateef-Regular.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600


# Splash système (spec identité §13 C1). Sources verrouillées (commit d90fdc2) :
# splash_logo*.png = 1152x1152, mains W 52 %, tenant dans le cercle de 768 px
# exigé par Android 12+. Régénérer : dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F4EDD8"
  image: assets/splash/splash_logo.png
  color_dark: "#0A5C34"
  image_dark: assets/splash/splash_logo_ivory.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#F4EDD8"
    image: assets/splash/splash_logo.png
    color_dark: "#0A5C34"
    image_dark: assets/splash/splash_logo_ivory.png

# Icônes launcher Android (legacy + adaptive + monochrome) et AppIcon iOS,
# générées depuis les PNG verrouillés (commit d90fdc2), à utiliser tels quels.
# Les calques adaptive sont déjà calibrés (mains W 54 % du canvas 108 dp, dans
# le cercle sûr 66 dp) : l'inset doit rester à 0, sinon le générateur réduit
# le symbole de 16 % par côté. Régénérer : dart run flutter_launcher_icons
# puis `git checkout -- ios/Runner.xcodeproj/project.pbxproj` : la v0.14.4
# réécrit à tort ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS
# (le nom d'icône « AppIcon » y est déjà configuré, aucun changement requis).
flutter_launcher_icons:
  image_path: assets/icon/icon_master.png
  android: true
  adaptive_icon_background: "#F4EDD8"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true

