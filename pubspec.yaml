name: test_1
description: "App Father's Douaas"
publish_to: 'none'

version: 1.1+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^17.2.0
  share_plus: ^7.2.1
  provider: ^6.0.5
  workmanager: ^0.9.0+3
  url_launcher: ^6.3.0
  in_app_review : ^2.0.9


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/data/duas.json
    - assets/premium/previews/dark_luxe_thumb.png
    - assets/premium/previews/emerald_thumb.png
    - assets/premium/previews/white_elegant_thumb.png
    - assets/splash/splash_gold.png
    - assets/icon/app_icon.png
    - assets/premium/templates/dark_luxe.png
    - assets/premium/templates/emerald.png
    - assets/premium/templates/white_elegant.png


  fonts:
    - family: Lateef
      fonts:
        - asset: assets/fonts/Lateef-Regular.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600


flutter_native_splash:
  color: "#0E7A5B"
  image: assets/splash/splash_gold.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#0E7A5B"
    image: assets/splash/splash_gold.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0E7A5B"   # même que ton fond vert
  adaptive_icon_foreground: "assets/icon/app_icon.png"

